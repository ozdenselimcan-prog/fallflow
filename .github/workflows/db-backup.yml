# Tägliches, verschlüsseltes Backup der FallFlow-Datenbank (Supabase Free hat keine eigenen Backups).
#
# Benötigte Repository-Secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL     Verbindungsadresse "Session pooler" aus Supabase (Connect → Session pooler),
#                       inkl. Datenbank-Passwort: postgresql://postgres.<ref>:<passwort>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   BACKUP_PASSPHRASE   selbst gewähltes, langes Passwort – ohne dieses lässt sich das Backup nicht öffnen
#
# Das Repository ist öffentlich: Die Sicherung wird deshalb VOR dem Hochladen mit AES-256 verschlüsselt.
# Wiederherstellen: siehe docs/BACKUP.md
name: Datenbank-Backup

on:
  schedule:
    - cron: "30 2 * * *" # täglich 02:30 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Secrets prüfen
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::SUPABASE_DB_URL und BACKUP_PASSPHRASE müssen als Repository-Secrets gesetzt sein."
            exit 1
          fi

      - name: PostgreSQL-Client installieren
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Sichern und verschlüsseln
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # public = alle FallFlow-Daten, auth = Benutzerkonten, storage = Dateiverzeichnis (die Dateien selbst liegen bei Supabase)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage --file=fallflow.dump
          gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" --output "fallflow-$STAMP.dump.gpg" fallflow.dump
          rm -f fallflow.dump
          ls -lh "fallflow-$STAMP.dump.gpg"

      - name: Verschlüsseltes Backup ablegen (90 Tage)
        uses: actions/upload-artifact@v4
        with:
          name: fallflow-db-${{ env.STAMP }}
          path: fallflow-${{ env.STAMP }}.dump.gpg
          retention-days: 90
          if-no-files-found: error
