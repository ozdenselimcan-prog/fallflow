name: Mail-Abruf (Cron-Ersatz)

# Vercel Hobby erlaubt nur einen Cron-Lauf pro Tag. Damit E-Mails/WhatsApp-Follow-ups nicht bis zu 24 Stunden
# liegen bleiben, stößt dieser GitHub-Actions-Job denselben Endpunkt zusätzlich alle 10 Minuten an.
# CRON_SECRET muss dafür als Repository-Secret hinterlegt sein (Settings → Secrets and variables → Actions).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: FallFlow-Endpunkt aufrufen
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://selimcan-7nxd.vercel.app/api/cron/follow-ups"
